<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="590" viewBox="0 0 1310 590"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs><rect width="1310" height="590" fill="white"/><text x="20" y="34" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#222">Native dependencies of each OpenGL backend</text><rect x="20" y="60" width="200" height="46" fill="#dddddd" stroke="#bbbbbb"/><text x="28" y="88" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#222">Configuration</text><rect x="220" y="60" width="110" height="46" fill="#dddddd" stroke="#bbbbbb"/><text x="228" y="88" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#222">Provided by</text><rect x="330" y="60" width="250" height="46" fill="#dddddd" stroke="#bbbbbb"/><text x="338" y="88" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#222">Native libraries</text><rect x="580" y="60" width="380" height="46" fill="#dddddd" stroke="#bbbbbb"/><text x="588" y="88" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#222">Install</text><rect x="960" y="60" width="330" height="46" fill="#dddddd" stroke="#bbbbbb"/><text x="968" y="88" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#222">Select</text><rect x="20" y="106" width="200" height="46" fill="white" stroke="#cccccc"/><text x="28" y="133.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#222">Linux, GLX (default)</text><rect x="220" y="106" width="110" height="46" fill