# Check whether the function pointer types (PFNGL...PROC) and constants of the Khronos glext.h, as
# generated by jextract, depend on the OS.
#
# The same glext.h and khrplatform.h are generated with the same jextract on Linux, Windows and
# macOS, then compared after replacing the C type layouts by their definition on each OS (e.g. a
# C_LONG is a JAVA_LONG on Linux and macOS, a JAVA_INT on Windows). If they are identical, or only
# differ on declarations PanamaGL does not use, a single glext binding can serve all OS.

name: glext per OS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ "glext-per-os" ]

jobs:
  generate:
    name: Generate (${{ matrix.family }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  family: linux,   jextract: linux-x64 }
          - { os: windows-latest, family: windows, jextract: windows-x64 }
          - { os: macos-latest,   family: macos,   jextract: macos-aarch64 }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # The same headers on every OS (paths relative to the workspace, which tar accepts on Windows)
      - name: Download the Khronos headers
        run: |
          mkdir -p "_khronos/GL" "_khronos/KHR"
          curl -sfL -o "_khronos/GL/glext.h" https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/${{ env.REGISTRY_REF }}/api/GL/glext.h
          curl -sfL -o "_khronos/KHR/khrplatform.h" https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/${{ env.REGISTRY_REF }}/api/KHR/khrplatform.h
          mkdir -p generated/${{ matrix.family }}
          { grep -m1 'GL_GLEXT_VERSION ' "_khronos/GL/glext.h"; sha1sum _khronos/*/*.h; } \
            | tee generated/${{ matrix.family }}/versions.txt
        env:
          REGISTRY_REF: main

      # The jextract 22 build that generated the bindings of PanamaGL
      - name: Download jextract 22
        run: |
          curl -sfL -o jextract.tar.gz https://download.java.net/java/early_access/jextract/22/6/openjdk-22-jextract+6-47_${{ matrix.jextract }}_bin.tar.gz
          mkdir -p _jextract && tar -xzf jextract.tar.gz -C _jextract && rm jextract.tar.gz
          if [ "$RUNNER_OS" = Windows ]; then name=jextract.bat; else name=jextract; fi
          bin=$PWD/$(find _jextract -path "*/bin/$name" | head -1)
          [ "$RUNNER_OS" = macOS ] && xattr -dr com.apple.quarantine _jextract || true
          echo "JEXTRACT=$bin" >> "$GITHUB_ENV"
          "$bin" --version 2>&1 | tee -a generated/${{ matrix.family }}/versions.txt

      - name: Generate
        run: |
          .github/scripts/bindings/glext/generate_glext.sh "$JEXTRACT" "_khronos" generated/${{ matrix.family }}
          grep -h 'static final.* C_' generated/${{ matrix.family }}/opengl/glext/glext_h*.java

      - name: Archive
        run: tar -czf glext-${{ matrix.family }}.tgz generated

      - uses: actions/upload-artifact@v4
        with:
          name: glext-${{ matrix.family }}
          path: glext-${{ matrix.family }}.tgz

  compare:
    name: Compare Linux, Windows and macOS
    runs-on: ubuntu-latest
    needs: generate
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: glext-*
          path: archives
          merge-multiple: true

      - name: Compare
        run: |
          for archive in archives/*.tgz; do tar -xzf "$archive"; done
          mkdir -p reports
          for other in windows macos; do
            if [ ! -d generated/$other ]; then echo "## $other : bindings missing" | tee -a "$GITHUB_STEP_SUMMARY"; continue; fi
            python3 .github/scripts/bindings/compare_bindings.py generated/linux generated/$other \
              --labels linux $other --resolve-layouts \
              --uses panama-gl-wrappers-linux/src panama-gl-wrappers-windows/src panama-gl-wrappers-macos/src panama-gl-api/src/main \
              --output reports/linux-$other.md > /dev/null
            {
              echo "## Linux vs $other"
              echo '```'; cat generated/linux/versions.txt; echo; cat generated/$other/versions.txt; echo '```'
              sed -n '3,/^\*\*/p' reports/linux-$other.md
            } >> "$GITHUB_STEP_SUMMARY"
            head -n 600 reports/linux-$other.md
          done
          for other in windows macos; do [ -f reports/linux-$other.md ] || continue; sed -n '1,/^\*\*/p' reports/linux-$other.md; grep -A2 '^### Used by PanamaGL' reports/linux-$other.md || true; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glext-per-os-report
          path: reports
