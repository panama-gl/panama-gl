<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs><rect width="1060" height="640" fill="white"/><text x="20" y="34" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#222">EGL in PanamaGL : EGL only replaces GLX, the GL and GLEXT calls do not change</text><rect x="30" y="70" width="300" height="70" rx="7" fill="#dbe9ff" stroke="#555555" stroke-width="1.2"/><text x="180.0" y="101.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">EGLContext_linux</text><text x="180.0" y="118.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">creates the context, makes it current</text><rect x="380" y="70" width="300" height="70" rx="7" fill="#dbe9ff" stroke="#555555" stroke-width="1.2"/><text x="530.0" y="101.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">GL_linux</text><text x="530.0" y="118.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">the GL interface of PanamaGL</text><rect x="750" y="70" width="280" height="70" rx="7" fill="#dbe9ff" stroke="#555555" stroke-width="1.2"/><text x="890.0" y="101.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">FBO_linux</text><text x="890.0" y="118.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">render target, glReadPixels</text><rect x="30" y="200" width="300" height="160" rx="7" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/><text x="180.0" y="233.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">EGL_linux (libEGL)</text><text x="180.0" y="250.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">eglGetPlatformDisplay(SURFACELESS)</text><text x="180.0" y="267.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">eglInitialize</text><text x="180.0" y="284.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">eglBindAPI(EGL_OPENGL_API)</text><text x="180.0" y="301.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">eglCreateContext(compatibility)</text><text x="180.0" y="318.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">eglMakeCurrent(no surface)</text><text x="180.0" y="335.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">eglGetProcAddress</text><line x1="180" y1="140" x2="180" y2="200" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="380" y="200" width="220" height="70" rx="7" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/><text x="490.0" y="222.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">opengl.linux.gl_h</text><text x="490.0" y="239.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">GL 1.0 to 1.3</text><text x="490.0" y="256.5" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">called directly</text><line x1="490" y1="140" x2="490" y2="200" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><text x="484" y="175" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="end" fill="#444">glClear, glBegin...</text><rect x="380" y="290" width="300" height="70" rx="7" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/><text x="530.0" y="321.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">opengl.glext.PFNGL...PROC</text><text x="530.0" y="338.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">GL 1.4 and later : by pointer</text><line x1="650" y1="140" x2="650" y2="290" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><text x="656" y="175" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#444">glGenFramebuffers...</text><rect x="750" y="200" width="280" height="160" rx="7" fill="#eeeeee" stroke="#555555" stroke-width="1.2"/><text x="890.0" y="242.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">GLFunctionLoader_linux</text><text x="890.0" y="259.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">eglGetProcAddress of EGL_linux</text><text x="890.0" y="276.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">once an EGL context exists,</text><text x="890.0" y="293.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">glXGetProcAddress otherwise.</text><text x="890.0" y="310.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">Resolved at the first call,</text><text x="890.0" y="327.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">then cached.</text><line x1="750" y1="325" x2="682" y2="325" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><text x="716" y="316" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">pointer</text><line x1="890" y1="140" x2="890" y2="200" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="420" width="1000" height="70" rx="7" fill="#dff3df" stroke="#555555" stroke-width="1.2"/><text x="530.0" y="451.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">OpenGL implementation chosen by EGL</text><text x="530.0" y="468.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">Mesa : llvmpipe (CPU), Zink (OpenGL over Vulkan), radeonsi, iris, nouveau...   or the GPU vendor (NVIDIA via EGL_EXT_platform_device)</text><line x1="180" y1="362" x2="180" y2="420" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="530" y1="362" x2="530" y2="420" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="890" y1="362" x2="890" y2="420" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><text x="30" y="525" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#222">• EGL is the Khronos binding API : it replaces GLX (Linux), WGL (Windows), CGL (macOS) to create the context and resolve functions.</text><text x="30" y="547" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#222">• The headers do not change : gl.h of the OS for the functions exported by libGL, glext.h of Khronos for the others (types PFNGL...PROC).</text><text x="30" y="569" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#222">• Surfaceless : no window nor display. PanamaGL always renders in a FBO, then reads the pixels back to show them in AWT, Swing, JavaFX or SWT.</text><text x="30" y="591" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#222">• Selected with PANAMAGL_LINUX_CONTEXT=egl, -Dpanamagl.linux.context=egl or APanamaGLFactory_linux.setUseEGL(true). GLX remains the default.</text><text x="30" y="613" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#222">• On macOS, the same classes run with Mesa's libEGL and libGL (Homebrew) : see MesaLibraries.</text></svg>
