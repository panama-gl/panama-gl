ily="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#222">macOS, Mesa Zink</text><rect x="220" y="474" width="110" height="46" fill="#efe2fb" stroke="#cccccc"/><text x="228" y="501.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Homebrew</text><rect x="330" y="474" width="250" height="46" fill="white" stroke="#cccccc"/><text x="338" y="493.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">+ libvulkan.1.dylib</text><text x="338" y="509.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">+ KosmicKrisp or MoltenVK</text><rect x="580" y="474" width="380" height="46" fill="white" stroke="#cccccc"/><text x="588" y="501.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#222">brew install vulkan-loader molten-vk</text><rect x="960" y="474" width="330" height="46" fill="white" stroke="#cccccc"/><text x="968" y="493.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#222">GALLIUM_DRIVER=zink</text><text x="968" y="509.0" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#222">VK_DRIVER_FILES=...icd.json</text><text x="20" y="548" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#444" font-style="italic">« system » : installed with the OS or its packages.  « shipped » : to distribute with the application.  « Homebrew » : to install on the Mac.</text></svg>
