"660" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="450" y1="410" x2="450" y2="660" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="465" y1="620" x2="465" y2="660" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="650" y1="620" x2="650" y2="660" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="450" width="16" height="14" rx="3" fill="#dbe9ff" stroke="#555555"/><text x="64" y="462" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">PanamaGL (Java)</text><rect x="40" y="470" width="16" height="14" rx="3" fill="#eeeeee" stroke="#555555"/><text x="64" y="482" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">native entry points, loaders</text><rect x="40" y="490" width="16" height="14" rx="3" fill="#dff3df" stroke="#555555"/><text x="64" y="502" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Mesa OpenGL</text><rect x="40" y="510" width="16" height="14" rx="3" fill="#fde2e1" stroke="#555555"/><text x="64" y="522" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Vulkan</text><rect x="40" y="530" width="16" height="14" rx="3" fill="#efe2fb" stroke="#555555"/><text x="64" y="542" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Metal (Apple)</text><rect x="40" y="550" width="16" height="14" rx="3" fill="#fff0d6" stroke="#555555"/><text x="64" y="562" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#222">Direct3D 12 (Microsoft)</text><text x="40" y="740" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#444" font-style="italic">LIBGL_ALWAYS_SOFTWARE=1 lets Zink use a CPU Vulkan device (lavapipe). Zink needs Vulkan features that MoltenVK lacks (nullDescriptor of robustness2).</text></svg>
