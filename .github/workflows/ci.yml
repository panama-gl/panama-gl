# Build and test Panama GL on Windows, macOS and Linux, each on x86_64 and ARM64
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Java CI with Maven

on:
  push:
  pull_request:
  # Sent by the Build and Deploy workflow of panama-gl-bindings after deploying new bindings :
  # rebuild and test main against them
  repository_dispatch:
    types: [ bindings-deployed ]
  # Run on demand, e.g. after deploying the bindings by hand
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't cancel other jobs if one platform fails
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest    # Linux x86_64
          - ubuntu-24.04-arm # Linux ARM64
          - macos-latest     # macOS ARM (Apple Silicon)
          - macos-15-intel   # macOS Intel x86_64 (last x86_64 image; GitHub Actions drops x86_64 ~Aug 2027)
          - windows-latest   # Windows x86_64
          - windows-11-arm   # Windows ARM64
        # macos-15-intel only runs on main (push, bindings deployment) and on demand : not on pull
        # requests nor on the push of other branches.
        # Tests run each test class in a fresh JVM (forkCount=1, reuseForks=false in pom.xml, see why
        # there). Starting a JVM takes about 5.5 s on this runner instead of about 1 s on the others,
        # so its build takes about 7 min instead of 1 to 2 min, for 63 test classes. Pull requests
        # keep a fast feedback, and macOS x86_64 is still tested before each deployment, which
        # happens on main. Run the workflow by hand (workflow_dispatch) to test a branch on it.
        # The "Tested platforms" job then accepts that macOS is not tested on x86_64 : keep its
        # condition in sync with this one.
        exclude:
          - os: ${{ (github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch') && 'macos-15-intel' || '' }}
        include:
          # OpenJFX publishes no Windows ARM64 build : use Liberica Full JDK 22, which bundles
          # ARM64 JavaFX modules (see the windows-aarch64-jdk-javafx profile of panama-gl-ui-javafx)
          - os: windows-11-arm
            distribution: liberica
            java-package: jdk+fx

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------
      # JDK 22 is required for Panama Foreign Function & Memory API
      # -------------------------------------------------------
      - name: Set up JDK ${{ matrix.java || '22' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java || '22' }}
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-package: ${{ matrix.java-package || 'jdk' }}
          cache: maven

      # -------------------------------------------------------
      # The bindings are redeployed with the same version, so the
      # cached ones would be used instead of those just deployed.
      # Remove them when triggered by a bindings deployment.
      # -------------------------------------------------------
      - name: Remove cached bindings
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BINDINGS_SHA: ${{ github.event.client_payload.sha }}
          BINDINGS_RUN: ${{ github.event.client_payload.run_url }}
        run: |
          echo "Bindings commit : ${BINDINGS_SHA:-unknown} ${BINDINGS_RUN}"
          rm -rf ~/.m2/repository/org/jzy3d/panama-gl-bindings*

      # Maven is not installed on every runner image (e.g. Windows ARM64)
      - name: Install Maven if missing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command mvn -ErrorAction SilentlyContinue) { mvn --version; exit 0 }
          $version = "3.9.9"
          Invoke-WebRequest `
            -Uri "https://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.zip" `
            -OutFile maven.zip
          Expand-Archive -Path maven.zip -DestinationPath C:\maven
          "C:\maven\apache-maven-$version\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # -------------------------------------------------------
      # Linux: install OpenGL / GLUT native libraries + virtual display
      # -------------------------------------------------------
      - name: Install OpenGL and GLUT libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev xvfb

      # -------------------------------------------------------
      # macOS : Mesa from Homebrew, required by the EGL context tests
      # (TestEGLContext_linux), which fail without it.
      # -------------------------------------------------------
      - name: Install Mesa (macOS)
        if: runner.os == 'macOS'
        run: brew install mesa mesa-glu

      # -------------------------------------------------------
      # Build & Test
      # Linux uses xvfb-run for the virtual display required by
      # AWT/Swing components during tests.
      # -------------------------------------------------------
      - name: Build and test with Maven (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            mvn --batch-mode package --file pom.xml

      - name: Build and test with Maven (macOS)
        if: runner.os == 'macOS'
        run: mvn --batch-mode package --file pom.xml

      - name: Build and test with Maven (Windows)
        if: runner.os == 'Windows'
        # The runners have no GPU driver : the opengl32.dll of Windows only provides OpenGL 1.1.
        # The tests use Mesa d3d12 (OpenGL over Direct3D 12, on WARP), loaded from
        # panama-gl-bindings-windows-mesa, and the freeglut.dll of
        # panama-gl-bindings-windows-freeglut : both are test dependencies on Windows.
        env:
          PANAMAGL_WINDOWS_OPENGL: mesa-d3d12
        run: mvn --batch-mode package --file pom.xml ${{ matrix.maven-args }}
        shell: pwsh

      # -------------------------------------------------------
      # Collect Surefire reports (always, even on test failure)
      # -------------------------------------------------------
      - name: Collect Surefire reports (Unix)
        if: runner.os != 'Windows' && always()
        run: |
          mkdir -p surefire-reports
          find . -path "*/target/surefire-reports/*.xml" -exec cp {} surefire-reports/ \;
          cp panama-gl-ui-awt/target/panamagl-platform.properties surefire-reports/ || true
          for report in */target/site/jacoco/jacoco.csv; do
            [ -f "$report" ] && cp "$report" "surefire-reports/jacoco-${report%%/*}.csv"
          done

      - name: Collect Surefire reports (Windows)
        if: runner.os == 'Windows' && always()
        run: |
          New-Item -ItemType Directory -Force -Path surefire-reports | Out-Null
          Get-ChildItem -Path . -Recurse -Filter "*.xml" |
            Where-Object { $_.FullName -like "*\target\surefire-reports\*" } |
            Copy-Item -Destination surefire-reports
          Copy-Item -Path panama-gl-ui-awt\target\panamagl-platform.properties `
            -Destination surefire-reports -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -Filter "jacoco.csv" |
            Where-Object { $_.FullName -like "*\target\site\jacoco\*" } |
            ForEach-Object {
              $module = $_.Directory.Parent.Parent.Parent.Name
              Copy-Item -Path $_.FullName -Destination "surefire-reports\jacoco-$module.csv"
            }
        shell: pwsh

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-${{ matrix.os }}
          path: surefire-reports
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: "*/target/site/jacoco"
          if-no-files-found: ignore

      # Rendering of the reference scene by TestBackendRendering, named after the backend
      - name: Upload renderings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderings-${{ matrix.os }}
          path: panama-gl-samples/target/renderings
          if-no-files-found: ignore

  # -------------------------------------------------------
  # OpenGL over Vulkan : run the tests on Linux with a headless
  # EGL context (PANAMAGL_LINUX_CONTEXT=egl) and Mesa Zink
  # (GALLIUM_DRIVER=zink) on lavapipe, the CPU Vulkan driver of
  # Mesa (LIBGL_ALWAYS_SOFTWARE=1 lets Zink use a CPU device).
  #
  # Excluded : the tests creating a GLX or GLUT context
  # explicitly. Zink needs DRI3 under X11, which Xvfb lacks, so
  # GLX can not run on Zink here. Xvfb is still needed by the
  # AWT, Swing, JavaFX and SWT tests, and by GLUT.
  #
  # GALLIUM_DRIVER applies to every OpenGL user of the process :
  # the OpenGL (GLX) pipeline of JavaFX would fail as well, so
  # JavaFX uses its software pipeline (prism.order=sw).
  # -------------------------------------------------------
  zink:
    name: Build & Test (OpenGL over Vulkan, Zink)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven

      - name: Install OpenGL, GLUT, EGL and Vulkan (lavapipe) libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev libegl1 xvfb \
            mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | grep -E "deviceName|driverName|apiVersion" || true

      - name: Build and test with Maven on Zink
        env:
          PANAMAGL_LINUX_CONTEXT: egl
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: zink
          JDK_JAVA_OPTIONS: -Dprism.order=sw
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            mvn --batch-mode package --file pom.xml -Djacoco.skip=true \
              -Dtest='Test*,*Test,ITTest*,!TestGLXContext_linux,!TestGLFunctionLoader_linux,!TestGLUTContext_linux,!TestFBO_linux,!TestGLCanvasSWT_direct' \
              -Dsurefire.failIfNoSpecifiedTests=false

      - name: Check the renderer is Zink
        run: |
          report=panama-gl-wrappers-linux/target/surefire-reports/TEST-panamagl.platform.linux.TestEGLContext_linux_Zink.xml
          grep -o "TestEGLContext_linux_Zink : [^&<]*" "$report"
          grep -q "zink Vulkan" "$report"
          ! grep -q "<skipped" "$report"

      - name: Run the headless EGL demo on Zink, without X display
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: zink
        run: |
          # Classpath of the samples built by this reactor, rather than of released PanamaGL jars
          mvn --batch-mode -q -pl panama-gl-samples -am package dependency:build-classpath \
            -DskipTests -Djacoco.skip=true -Dmdep.outputFile=cp.txt
          mkdir -p demo-zink
          java --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true \
            -Djava.library.path=/usr/lib/x86_64-linux-gnu \
            -cp "panama-gl-samples/target/classes:$(cat panama-gl-samples/cp.txt)" \
            demos.panamagl.linux.DemoEGL_Offscreen demo-zink/DemoEGL_Offscreen_Zink.png 480 360 50 \
            | tee demo-zink/output.txt
          grep -q "Over Vulkan (Zink) : true" demo-zink/output.txt

      - name: Collect Surefire reports
        if: always()
        run: |
          mkdir -p zink-reports
          find . -path "*/target/surefire-reports/*.xml" -exec cp {} zink-reports/ \;

      - name: Upload Surefire reports and demo image
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zink-reports
          path: |
            zink-reports
            demo-zink
          if-no-files-found: ignore

      - name: Upload renderings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderings-zink-ubuntu-latest
          path: panama-gl-samples/target/renderings
          if-no-files-found: ignore

  # -------------------------------------------------------
  # Windows : render the reference scene on the other OpenGL
  # implementations of Mesa (the build job already renders it
  # with Mesa d3d12, i.e. OpenGL over Direct3D 12 on WARP) :
  # - llvmpipe : OpenGL on the CPU ;
  # - zink : OpenGL over Vulkan, on lavapipe (CPU Vulkan).
  # Builds of mmozeiko/build-mesa.
  # -------------------------------------------------------
  windows-mesa:
    name: Rendering (windows, ${{ matrix.opengl }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Mesa of panama-gl-bindings-windows-mesa, selected by PANAMAGL_WINDOWS_OPENGL. Mesa d3d12
        # is tested by the build job.
        opengl:
          # OpenGL on the CPU
          - mesa-llvmpipe
          # OpenGL over Vulkan, on lavapipe (Vulkan on the CPU)
          - mesa-zink-lavapipe
    env:
      PANAMAGL_WINDOWS_OPENGL: ${{ matrix.opengl }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven

      - name: Install Maven if missing
        shell: pwsh
        run: |
          if (Get-Command mvn -ErrorAction SilentlyContinue) { mvn --version; exit 0 }
          $version = "3.9.9"
          Invoke-WebRequest `
            -Uri "https://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.zip" `
            -OutFile maven.zip
          Expand-Archive -Path maven.zip -DestinationPath C:\maven
          "C:\maven\apache-maven-$version\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: mvn --batch-mode install --file pom.xml -pl panama-gl-samples -am "-DskipTests" "-Djacoco.skip=true"

      # The Vulkan loader ignores VK_DRIVER_FILES, set by PanamaGL for lavapipe, in elevated
      # processes as on GitHub runners : declare the ICD of the extracted bundle in the registry.
      - name: Declare the Vulkan driver of the bundle (Zink)
        if: matrix.opengl == 'mesa-zink-lavapipe'
        shell: pwsh
        run: |
          mvn --batch-mode -q -pl panama-gl-samples dependency:build-classpath "-Dmdep.outputFile=$PWD\cp.txt" "-Dmdep.includeScope=test"
          $cp = "panama-gl-api\target\classes;" + (Get-Content cp.txt -Raw).Trim()
          $icd = (java -cp $cp panamagl.platform.natives.NativeBundle extract mesa-lavapipe vulkan.icd | Select-Object -Last 1).Trim()
          if (-not (Test-Path $icd)) { Write-Error "ICD not extracted : $icd"; exit 1 }
          Get-Content $icd
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          # Vulkan loader : vulkan-1.dll is only installed with GPU drivers or the Vulkan runtime
          if (-not (Test-Path "C:\Windows\System32\vulkan-1.dll")) {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip" -OutFile vkrt.zip
            Expand-Archive -Path vkrt.zip -DestinationPath vkrt
            New-Item -ItemType Directory -Force -Path "C:\vulkan" | Out-Null
            Get-ChildItem -Path "vkrt" -Recurse -Filter "vulkan-1.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 | Copy-Item -Destination "C:\vulkan" -Force
            "C:\vulkan" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          "VK_LOADER_DEBUG=error,warn,driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test Mesa and render the scenes
        shell: pwsh
        run: |
          # PowerShell splits unquoted -Dname.with.dots=value arguments : quote them
          mvn --batch-mode package --file pom.xml -pl panama-gl-samples -am "-Djacoco.skip=true" `
            "-Dtest=TestMesa_windows,TestBackendRendering,TestRenderingBackend" "-Dsurefire.failIfNoSpecifiedTests=false"

      - name: Upload renderings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderings-windows-${{ matrix.opengl }}
          path: panama-gl-samples/target/renderings
          if-no-files-found: ignore

  # -------------------------------------------------------
  # macOS : render the reference scene with the OpenGL of Mesa
  # (Homebrew), through a headless EGL context of Mesa
  # (PANAMAGL_FACTORY=mesa-egl), rather than Apple OpenGL :
  # - llvmpipe : OpenGL on the CPU ;
  # - zink over KosmicKrisp : OpenGL over Vulkan over Metal ;
  # - zink over MoltenVK : OpenGL over Vulkan over Metal.
  # The build job renders it with Apple OpenGL (CGL), which
  # Apple implements over Metal on Apple Silicon.
  # -------------------------------------------------------
  macos-mesa:
    name: Rendering (macos, Mesa ${{ matrix.driver }}${{ matrix.vulkan && format(' over {0}', matrix.vulkan) || '' }})
    runs-on: macos-latest
    # Zink over Metal is experimental : KosmicKrisp finds no device on the runner, and MoltenVK lacks
    # the nullDescriptor feature that Zink requires. Failures are reported in the comparison.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: llvmpipe
          - driver: zink
            vulkan: kosmickrisp
            icd: /opt/homebrew/opt/mesa/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json
            experimental: true
          - driver: zink
            vulkan: moltenvk
            icd: /opt/homebrew/opt/molten-vk/etc/vulkan/icd.d/MoltenVK_icd.json
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven

      - name: Install Mesa, GLU, the Vulkan loader and MoltenVK with Homebrew
        run: |
          brew install mesa mesa-glu vulkan-loader molten-vk
          ls /opt/homebrew/opt/mesa/lib/dri /opt/homebrew/opt/mesa/share/vulkan/icd.d
          # Zink opens @rpath/libvulkan.1.dylib : expose Homebrew's loader in a default dyld fallback
          # path, since SIP removes DYLD_* variables from the shell scripts launching Maven
          sudo mkdir -p /usr/local/lib
          sudo ln -sf /opt/homebrew/opt/vulkan-loader/lib/libvulkan.1.dylib /usr/local/lib/libvulkan.1.dylib

      - name: Render the scenes
        env:
          PANAMAGL_FACTORY: mesa-egl
          GALLIUM_DRIVER: ${{ matrix.driver }}
          VK_DRIVER_FILES: ${{ matrix.icd }}
        run: |
          mvn --batch-mode package --file pom.xml -pl panama-gl-samples -am -Djacoco.skip=true \
            -Dtest=TestEGLContext_linux,TestBackendRendering,TestRenderingBackend -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload renderings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderings-macos-mesa-${{ matrix.driver }}${{ matrix.vulkan && format('-{0}', matrix.vulkan) || '' }}
          path: panama-gl-samples/target/renderings
          if-no-files-found: ignore

  # -------------------------------------------------------
  # Compare the renderings of the reference scene made on every
  # OS and backend : contact sheet, differences, summary table.
  # -------------------------------------------------------
  rendering-comparison:
    name: Rendering comparison
    runs-on: ubuntu-latest
    needs: [ build, zink, windows-mesa, macos-mesa ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: renderings-*
          path: renderings

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare the renderings
        run: |
          pip install --quiet pillow
          python .github/scripts/compare-renderings.py renderings rendering-comparison
          mkdir -p rendering-comparison/renderings
          find renderings -name "*.png" -exec cp {} rendering-comparison/renderings/ \;
          find renderings -name "*.properties" -exec cp {} rendering-comparison/renderings/ \;

      - name: Upload the comparison
        uses: actions/upload-artifact@v4
        with:
          name: rendering-comparison
          path: rendering-comparison

      # The contact sheets in the log too, as small JPEGs in base64, for tools that can read the
      # logs but not download the artifacts
      - name: Print the comparison images (base64 JPEG)
        run: |
          python - <<'EOF'
          import base64, io
          from pathlib import Path
          from PIL import Image
          for png in sorted(Path("rendering-comparison").glob("comparison-*.png")):
              scene = png.stem[len("comparison-"):]
              image = Image.open(png).convert("RGB")
              image.thumbnail((1500, 6000))
              out = io.BytesIO()
              image.save(out, "JPEG", quality=80)
              data = base64.b64encode(out.getvalue()).decode()
              print(f"::group::comparison-{scene}.jpg in base64")
              print(f"BEGIN-COMPARISON-JPEG {scene}")
              for i in range(0, len(data), 2000):
                  print(data[i:i + 2000])
              print(f"END-COMPARISON-JPEG {scene}")
              print("::endgroup::")
          EOF

  # -------------------------------------------------------
  # Report the platforms on which the tests ran (OS, CPU, JVM,
  # OpenGL) in the job summary, and fail if a PanamaGLFactory
  # declared by the wrappers was not tested on any runner.
  # -------------------------------------------------------
  tested-platforms:
    name: Tested platforms
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: surefire-reports-*
          path: reports

      # macos-15-intel only runs on main and on demand (see the exclude of the build matrix, keep
      # this condition in sync with it) : elsewhere, accept that macOS is not tested on x86_64.
      - name: Report tested platforms
        env:
          INTEL_EXCLUDED: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
        run: |
          allow=()
          if [ "$INTEL_EXCLUDED" = "true" ]; then
            allow=(--allow-untested "PanamaGLFactory_macOS:x86_64:Intel only runs on main")
          fi
          python3 .github/scripts/tested_platforms.py reports \
            panama-gl-wrappers-*/src/main/resources/META-INF/services/panamagl.factory.PanamaGLFactory \
            --output tested-platforms.md "${allow[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-platforms
          path: tested-platforms.md
          if-no-files-found: ignore

  # -------------------------------------------------------
  # Report the test coverage of each module on each runner
  # (JaCoCo, generated GL wrappers excluded) in the job summary.
  # HTML reports are in the coverage-<runner> artifacts.
  # -------------------------------------------------------
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: surefire-reports-*
          path: reports

      - name: Report test coverage
        run: python3 .github/scripts/coverage_summary.py reports --output coverage.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.md
          if-no-files-found: ignore

  # -------------------------------------------------------
  # Deploy to the Jzy3d Maven FTP repository.
  # Runs only on push to main (never on branches or PRs),
  # after all matrix build jobs have passed.
  # Secrets are scoped to the "panama-ftp-env" environment.
  # -------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: panama-ftp-env
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: temurin
          cache: maven

      # The server id "panama-ftp" must match the distributionManagement id in pom.xml
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>panama-ftp</id>
                <username>${{ secrets.FTP_USERNAME }}</username>
                <password>${{ secrets.FTP_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy
        run: mvn --batch-mode --no-transfer-progress deploy -DskipTests -Denv.MAVEN_REPO_URL=${{ secrets.FTP_URL }}
