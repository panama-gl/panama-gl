# Check whether the bindings generated by jextract for an OS depend on the CPU.
#
# The OpenGL, GLU, GLUT, GLX, WGL and CGL bindings of each OS are generated with
# the same jextract, built from the same sources, natively on a x86_64 and on an
# ARM64 runner, then compared. If they are identical, or only differ on
# declarations PanamaGL does not use, a single binding per OS can serve both CPUs.
#
# jextract is built from its sources since no jextract build exists for
# Windows ARM64.

name: Bindings per CPU

on:
  push:
    branches: [ '1.3.1' ]
    paths:
      - '.github/workflows/bindings-per-cpu.yml'
      - '.github/scripts/bindings/**'
  workflow_dispatch:

env:
  # jextract version targeting JDK 23 and later
  JEXTRACT_COMMIT: 1e6737c22376fe66986a20837135699b9cf692d2

jobs:
  generate:
    name: Generate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     family: linux,   cpu: x64 }
          - { os: ubuntu-24.04-arm, family: linux,   cpu: arm64 }
          - { os: windows-latest,   family: windows, cpu: x64 }
          - { os: windows-11-arm,   family: windows, cpu: arm64 }
          - { os: macos-15-intel,   family: macos,   cpu: x64 }
          - { os: macos-latest,     family: macos,   cpu: arm64 }

    steps:
      - uses: actions/checkout@v4

      - name: Checkout panama-gl-bindings
        uses: actions/checkout@v4
        with:
          repository: panama-gl/panama-gl-bindings
          path: panama-gl-bindings

      - name: Checkout jextract
        uses: actions/checkout@v4
        with:
          repository: openjdk/jextract
          ref: ${{ env.JEXTRACT_COMMIT }}
          path: jextract

      # The JDK of the jextract runtime, then the JDK running Gradle 8.11, which does not run on JDK 25
      - name: Set up JDK 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: zulu

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu

      # -------------------------------------------------------
      # libclang and headers
      # -------------------------------------------------------
      - name: Install LLVM and OpenGL headers (Linux)
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libclang-18-dev llvm-18 \
            mesa-common-dev libgl-dev libglx-dev libglu1-mesa-dev freeglut3-dev libglew-dev
          # The libclang of Ubuntu is a symbolic link in /usr/lib/llvm-18, which jextract does not copy
          mkdir -p "$RUNNER_TEMP/llvm/lib/clang"
          cp -L "/usr/lib/$(gcc -print-multiarch)/libclang-18.so.18" "$RUNNER_TEMP/llvm/lib/libclang.so.18"
          cp -rL /usr/lib/llvm-18/lib/clang/18 "$RUNNER_TEMP/llvm/lib/clang/18"
          echo "LLVM_HOME=$RUNNER_TEMP/llvm" >> "$GITHUB_ENV"

      - name: Install LLVM (macOS)
        if: matrix.family == 'macos'
        run: |
          brew install llvm@18
          # The same SDK on both CPUs : the Xcode of the macOS 15 Intel image, if also installed
          if [ -d /Applications/Xcode_16.4.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          echo "LLVM_HOME=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"

      # The same LLVM release on both CPUs : the first one providing an installer for both.
      # Since LLVM 16, libclang spells unnamed structs "struct (unnamed at <file>:<line>:<column>)",
      # which jextract uses as a field or file name, invalid on Windows : the oldest LLVM
      # with an installer for both CPUs is used
      - name: Install LLVM (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'woa64' } else { 'win64' }
          $base = 'https://github.com/llvm/llvm-project/releases/download'
          $version = $null
          foreach ($v in '15.0.7', '15.0.6', '16.0.6', '17.0.6', '18.1.8') {
            $both = $true
            foreach ($a in 'win64', 'woa64') {
              try { Invoke-WebRequest -Method Head -Uri "$base/llvmorg-$v/LLVM-$v-$a.exe" | Out-Null }
              catch { $both = $false }
            }
            if ($both) { $version = $v; break }
          }
          if (-not $version) { Write-Error 'No LLVM release provides an installer for win64 and woa64'; exit 1 }
          Write-Host "Installing LLVM $version ($arch)"
          Invoke-WebRequest -Uri "$base/llvmorg-$version/LLVM-$version-$arch.exe" -OutFile llvm.exe
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList '/S', '/D=C:\llvm'
          Get-ChildItem C:\llvm\bin\libclang.dll, C:\llvm\lib\clang
          "LLVM_HOME=C:\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # -------------------------------------------------------
      # jextract
      # -------------------------------------------------------
      - name: Build jextract (Unix)
        if: matrix.family != 'windows'
        working-directory: jextract
        run: |
          sh ./gradlew --no-daemon -Pjdk_home="${{ steps.jdk25.outputs.path }}" -Pllvm_home="$LLVM_HOME" clean verify
          # The libclang of Ubuntu has an absolute resource directory : the builtin headers that
          # jextract also gives with -I would hide the system headers they include (e.g. stdint.h)
          if [ "${{ matrix.family }}" = linux ]; then rm -rf build/jextract/runtime/conf/jextract; fi
          build/jextract/bin/jextract --version | tee -a "$RUNNER_TEMP/versions.txt"

      - name: Build jextract (Windows)
        if: matrix.family == 'windows'
        working-directory: jextract
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon "-Pjdk_home=${{ steps.jdk25.outputs.path }}" "-Pllvm_home=$env:LLVM_HOME" clean verify
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\build\jextract\bin\jextract.bat --version | Tee-Object -FilePath "$env:RUNNER_TEMP\versions.txt" -Append

      # -------------------------------------------------------
      # Bindings
      # -------------------------------------------------------
      - name: Generate bindings (Linux)
        if: matrix.family == 'linux'
        run: |
          .github/scripts/bindings/generate_linux.sh jextract/build/jextract/bin/jextract \
            panama-gl-bindings/scripts/linux generated/${{ matrix.family }}-${{ matrix.cpu }}

      - name: Generate bindings (macOS)
        if: matrix.family == 'macos'
        run: |
          .github/scripts/bindings/generate_macos.sh jextract/build/jextract/bin/jextract \
            panama-gl-bindings/scripts/macos generated/${{ matrix.family }}-${{ matrix.cpu }}

      - name: Generate bindings (Windows)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          .github/scripts/bindings/generate_windows.ps1 `
            -JExtract jextract\build\jextract\bin\jextract.bat `
            -Scripts panama-gl-bindings\scripts\windows `
            -Out generated\${{ matrix.family }}-${{ matrix.cpu }}

      - name: Describe the runner
        shell: bash
        run: |
          out=generated/${{ matrix.family }}-${{ matrix.cpu }}
          { echo "Runner ${{ matrix.os }} ($RUNNER_OS $RUNNER_ARCH)"; cat "$RUNNER_TEMP/versions.txt"; } >> "$out/versions.txt"
          cat "$out/versions.txt"
          du -sh "$out"/*/

      # jextract may name a file after an unnamed struct and its location, e.g.
      # "struct (unnamed at /usr/include/X11/Xlib.h:493:9).java", which an artifact can not contain
      - name: Archive bindings
        shell: bash
        run: tar -czf generated-${{ matrix.family }}-${{ matrix.cpu }}.tgz generated

      - uses: actions/upload-artifact@v4
        with:
          name: generated-${{ matrix.family }}-${{ matrix.cpu }}
          path: generated-${{ matrix.family }}-${{ matrix.cpu }}.tgz

  compare:
    name: Compare x64 and ARM64
    runs-on: ubuntu-latest
    needs: generate
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: generated-*
          path: archives
          merge-multiple: true

      - name: Compare
        run: |
          for archive in archives/*.tgz; do tar -xzf "$archive"; done
          mkdir -p reports
          for family in linux windows macos; do
            x64=generated/$family-x64
            arm64=generated/$family-arm64
            if [ ! -d "$x64" ] || [ ! -d "$arm64" ]; then
              echo "## $family : bindings missing" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            python3 .github/scripts/bindings/compare_bindings.py "$x64" "$arm64" --labels x64 arm64 \
              --uses panama-gl-wrappers-$family/src panama-gl-api/src/main \
              --output reports/$family.md
            {
              echo "## $family"
              echo '```'; cat "$x64/versions.txt"; echo; cat "$arm64/versions.txt"; echo '```'
              # Table and verdict only : the summary is limited to 1 MB
              sed -n '3,/^\*\*/p' reports/$family.md
              for f in "$x64"/*.includes; do
                name=$(basename "$f")
                if cmp -s "$f" "$arm64/$name"; then echo "* \`$name\` identical"; else echo "* \`$name\` differs"; fi
              done
            } >> "$GITHUB_STEP_SUMMARY"
            : > reports/$family-includes.diff
            for f in "$x64"/*.includes; do
              diff -u "$f" "$arm64/$(basename "$f")" >> reports/$family-includes.diff || true
            done
            # Report in the log, with the includes that differ
            head -n 1500 reports/$family.md
            grep -E '^[-+]--include' reports/$family-includes.diff | head -n 300 || true
          done
          # Summaries last, to be read at the end of the log
          for family in linux windows macos; do
            [ -f reports/$family.md ] && sed -n '1,/^\*\*/p' reports/$family.md
            [ -f reports/$family.md ] && grep -A2 '^### Used by PanamaGL' reports/$family.md
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bindings-per-cpu-report
          path: reports
